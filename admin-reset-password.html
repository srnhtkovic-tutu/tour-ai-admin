<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅つづき 管理システム - パスワード再設定</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>旅つづき</h1>
    <p class="subtitle">地域観光管理システム</p>
    <h2>新しいパスワードの設定</h2>
    <form id="resetPasswordForm">
      <label for="newPassword">新しいパスワード</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmPassword">新しいパスワード（確認）</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <p class="help-text">パスワードは8文字以上で入力してください。</p>
      <button id="updatePasswordButton" type="submit" disabled>パスワードを更新</button>
    </form>
    <p id="resetPasswordMessage" class="message" role="status" aria-live="polite">再設定リンクを確認しています...</p>
    <p><a class="secondary-link" href="admin-login.html">ログイン画面に戻る</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-auth.js"></script>
</body>
</html>
