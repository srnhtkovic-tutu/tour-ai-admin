<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<title>観光AI 管理画面</title>

<link rel="stylesheet" href="style.css">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

</head>

<body>

<h1>まちあるきAIガイド 管理画面</h1>

<p id="status">接続中...</p>

<div class="container">

    <!-- 左側：スポット一覧 -->
    <div class="leftPanel">

        <button id="newButton">
            ＋ 新しいスポット
        </button>

        <table>

            <thead>
                <tr>
                    <th>名前</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="spotBody">
            </tbody>

        </table>

    </div>

    <!-- 右側 -->
    <div class="editor-area">

        <!-- 編集フォーム -->
        <div class="editor">

            <h2>スポット編集</h2>

            <label>スポット名</label>
            <input id="name">

            <label>緯度</label>
            <input id="lat">

            <label>経度</label>
            <input id="lng">

            <label>画像URL</label>
            <input id="imageUrl">

            <label>キャッチコピー</label>
            <input id="catchCopy">

            <label>一番の推しは？</label>
            <input id="topReason">

            <label>推し　その１</label>
            <input id="point1">

            <label>推し　その２</label>
            <input id="point2">

            <label>推し　その３</label>
            <input id="point3">

            <label>オーナー体験</label>
            <textarea
                id="ownerExperience"
                rows="5">
            </textarea>

            <hr>

<h3>ユーザータイプ別おすすめ</h3>

<label>🍴 グルメな人におすすめ</label>

<textarea
    id="recommendFood"
    rows="2">
</textarea>

<label>🏯 歴史好きな人におすすめ</label>

<textarea
    id="recommendHistory"
    rows="2">
</textarea>

<label>🌿 癒されたい人におすすめ</label>

<textarea
    id="recommendRelax"
    rows="2">
</textarea>

<label>🚴 アクティブ好きな人におすすめ</label>

<textarea
    id="recommendActivity"
    rows="2">
</textarea>

<hr>

<h3>追加情報</h3>

<label>最新トピック</label>

<textarea
    id="latestTopics"
    rows="3">
</textarea>

<label>公式URL</label>

<input
    type="text"
    id="officialUrl">

<label>ベストシーズン</label>

<input
    type="text"
    id="bestSeason"
    placeholder="例：春・秋">

<label>タグ（カンマ区切り）</label>

<input
    type="text"
    id="tags"
    placeholder="例：紅葉,御朱印,国宝">

            <button id="saveButton">
                保存
            </button>

        </div>

        <!-- 地図 -->
        <div class="mapPanel">

            <h3>位置設定</h3>

            <p>
                地図をクリック、またはピンをドラッグしてください。
            </p>

            <div id="map"></div>

        </div>
        <button id="mapTypeBtn">
            🛰 航空写真
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="main.js"></script>

</body>

</html>
